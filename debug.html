<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug - Rivanilson</title>
    
    <!-- Firebase -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getFirestore, collection, getDocs, query, where } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';
        
        const firebaseConfig = {
            apiKey: "AIzaSyBuRHTtuKgpQE_qAdMIbT9_9qbjh4cbLI8",
            authDomain: "apiifood-e0d35.firebaseapp.com",
            projectId: "apiifood-e0d35",
            storageBucket: "apiifood-e0d35.firebasestorage.app",
            messagingSenderId: "905864103175",
            appId: "1:905864103175:web:a198383d3a66a7d2cd31a2"
        };
        
        window.firebaseApp = initializeApp(firebaseConfig);
        window.firebaseDb = getFirestore(window.firebaseApp);
        window.collection = collection;
        window.getDocs = getDocs;
        window.query = query;
        window.where = where;
    </script>
    
    <style>
        body {
            font-family: 'Courier New', monospace;
            background: #1e1e1e;
            color: #00ff00;
            padding: 2rem;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .debug-section {
            background: #2d2d2d;
            border: 1px solid #444;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }
        
        .debug-title {
            color: #ffff00;
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 1rem;
            border-bottom: 1px solid #444;
            padding-bottom: 0.5rem;
        }
        
        .log-entry {
            margin: 0.5rem 0;
            padding: 0.5rem;
            background: #333;
            border-left: 3px solid #00ff00;
        }
        
        .error {
            border-left-color: #ff0000;
            color: #ff6666;
        }
        
        .warning {
            border-left-color: #ffaa00;
            color: #ffdd66;
        }
        
        .success {
            border-left-color: #00ff00;
            color: #66ff66;
        }
        
        .btn {
            background: #00aa00;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 4px;
            cursor: pointer;
            margin: 0.5rem 0.5rem 0.5rem 0;
            font-family: inherit;
        }
        
        .btn:hover {
            background: #00dd00;
        }
        
        .btn-secondary {
            background: #0066cc;
        }
        
        .btn-secondary:hover {
            background: #0088ff;
        }
        
        pre {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 1rem;
            overflow-x: auto;
            font-size: 0.9rem;
        }
        
        .results {
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="debug-section">
            <div class="debug-title">🔍 DIAGNÓSTICO COMPLETO - RIVANILSON</div>
            <div class="log-entry">Sistema de Debug para identificar problemas com entregador Rivanilson</div>
            <div class="log-entry">Email: rivanilsonotaviano@gmail.com | ID: rivanilson</div>
            
            <button class="btn" onclick="runFullDiagnostic()">🚀 Executar Diagnóstico Completo</button>
            <button class="btn btn-secondary" onclick="checkFirebaseAssignments()">📦 Verificar Assignments</button>
            <button class="btn btn-secondary" onclick="testEmailMapping()">📧 Testar Mapeamento Email</button>
            <button class="btn btn-secondary" onclick="clearLogs()">🗑️ Limpar Logs</button>
        </div>

        <div id="results" class="results">
            <!-- Resultados aparecerão aqui -->
        </div>
    </div>

    <script>
        const RIVANILSON_EMAIL = 'rivanilsonotaviano@gmail.com';
        const RIVANILSON_ID = 'rivanilson';
        
        const EMAIL_TO_DELIVERY_ID = {
            'jackson_division@hotmail.com': 'jackson',
            'narlisonmedeiros04@gmail.com': 'narlison', 
            'rafaeljudson.profissional@gmail.com': 'rafael',
            'matheusmoura175@gmail.com': 'matheus',
            'boazd3@gmail.com': 'boaz',
            'andrade88210@gmail.com': 'gabriel',
            'rivanilsonotaviano@gmail.com': 'rivanilson'
        };

        // Função principal de diagnóstico
        async function runFullDiagnostic() {
            clearLogs();
            addLog('🚀 INICIANDO DIAGNÓSTICO COMPLETO', 'success');
            addLog(`📧 Email alvo: ${RIVANILSON_EMAIL}`, 'log');
            addLog(`🆔 ID alvo: ${RIVANILSON_ID}`, 'log');
            
            // Teste 1: Verificar mapeamento
            await testEmailMapping();
            
            // Teste 2: Verificar assignments no Firebase
            await checkFirebaseAssignments();
            
            // Teste 3: Verificar assignments por status
            await checkAssignmentsByStatus();
            
            // Teste 4: Verificar timestamps recentes
            await checkRecentAssignments();
            
            addLog('✅ DIAGNÓSTICO COMPLETO FINALIZADO', 'success');
        }

        // Teste 1: Verificar mapeamento de email
        async function testEmailMapping() {
            addLog('📧 TESTE 1: Verificando mapeamento de email...', 'warning');
            
            const mappedId = EMAIL_TO_DELIVERY_ID[RIVANILSON_EMAIL];
            
            if (mappedId === RIVANILSON_ID) {
                addLog(`✅ Mapeamento correto: ${RIVANILSON_EMAIL} → ${mappedId}`, 'success');
            } else {
                addLog(`❌ ERRO NO MAPEAMENTO: ${RIVANILSON_EMAIL} → ${mappedId || 'undefined'}`, 'error');
                addLog(`❌ Esperado: ${RIVANILSON_ID}`, 'error');
            }
            
            // Verificar todos os mapeamentos
            addLog('📋 Todos os mapeamentos disponíveis:', 'log');
            Object.entries(EMAIL_TO_DELIVERY_ID).forEach(([email, id]) => {
                const status = email === RIVANILSON_EMAIL ? '← RIVANILSON' : '';
                addLog(`  ${email} → ${id} ${status}`, 'log');
            });
        }

        // Teste 2: Verificar assignments no Firebase
        async function checkFirebaseAssignments() {
            addLog('📦 TESTE 2: Verificando assignments no Firebase...', 'warning');
            
            try {
                const assignmentsRef = window.collection(window.firebaseDb, 'deliveryAssignments');
                const snapshot = await window.getDocs(assignmentsRef);
                
                addLog(`📊 Total de assignments encontrados: ${snapshot.size}`, 'log');
                
                let rivanilsonAssignments = 0;
                let allAssignments = [];
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    allAssignments.push({
                        id: doc.id,
                        deliveryId: data.deliveryId,
                        deliveryName: data.deliveryName,
                        status: data.status,
                        assignedAt: data.assignedAt,
                        orderId: data.order?.displayId || 'N/A'
                    });
                    
                    if (data.deliveryId === RIVANILSON_ID) {
                        rivanilsonAssignments++;
                        addLog(`✅ Assignment encontrado para Rivanilson: Pedido #${data.order?.displayId || doc.id} (${data.status})`, 'success');
                    }
                });
                
                if (rivanilsonAssignments === 0) {
                    addLog(`❌ NENHUM assignment encontrado para deliveryId: "${RIVANILSON_ID}"`, 'error');
                    addLog('📋 Verificando todos os deliveryIds encontrados:', 'warning');
                    
                    const deliveryIds = [...new Set(allAssignments.map(a => a.deliveryId))];
                    deliveryIds.forEach(id => {
                        const count = allAssignments.filter(a => a.deliveryId === id).length;
                        const status = id === RIVANILSON_ID ? '← RIVANILSON' : '';
                        addLog(`  "${id}": ${count} assignments ${status}`, 'log');
                    });
                } else {
                    addLog(`✅ ${rivanilsonAssignments} assignments encontrados para Rivanilson`, 'success');
                }
                
                // Mostrar últimos 10 assignments
                addLog('📋 Últimos 10 assignments (todos os entregadores):', 'log');
                allAssignments
                    .sort((a, b) => new Date(b.assignedAt || 0) - new Date(a.assignedAt || 0))
                    .slice(0, 10)
                    .forEach(assignment => {
                        const timestamp = assignment.assignedAt ? new Date(assignment.assignedAt).toLocaleString('pt-BR') : 'Sem data';
                        const isRivanilson = assignment.deliveryId === RIVANILSON_ID ? '← RIVANILSON' : '';
                        addLog(`  Pedido #${assignment.orderId} → ${assignment.deliveryName} (${assignment.status}) - ${timestamp} ${isRivanilson}`, 'log');
                    });
                
            } catch (error) {
                addLog(`❌ ERRO ao buscar assignments: ${error.message}`, 'error');
                console.error('Erro detalhado:', error);
            }
        }

        // Teste 3: Verificar assignments por status
        async function checkAssignmentsByStatus() {
            addLog('📊 TESTE 3: Verificando assignments por status...', 'warning');
            
            try {
                const assignmentsRef = window.collection(window.firebaseDb, 'deliveryAssignments');
                const snapshot = await window.getDocs(assignmentsRef);
                
                const statusStats = {};
                const rivanilsonByStatus = {};
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const status = data.status || 'undefined';
                    
                    // Estatísticas gerais
                    statusStats[status] = (statusStats[status] || 0) + 1;
                    
                    // Estatísticas do Rivanilson
                    if (data.deliveryId === RIVANILSON_ID) {
                        rivanilsonByStatus[status] = (rivanilsonByStatus[status] || 0) + 1;
                    }
                });
                
                addLog('📊 Estatísticas gerais por status:', 'log');
                Object.entries(statusStats).forEach(([status, count]) => {
                    addLog(`  ${status}: ${count} assignments`, 'log');
                });
                
                addLog('📊 Estatísticas do Rivanilson por status:', 'log');
                if (Object.keys(rivanilsonByStatus).length === 0) {
                    addLog('  ❌ Nenhum assignment encontrado para Rivanilson', 'error');
                } else {
                    Object.entries(rivanilsonByStatus).forEach(([status, count]) => {
                        addLog(`  ${status}: ${count} assignments`, 'success');
                    });
                }
                
            } catch (error) {
                addLog(`❌ ERRO ao verificar status: ${error.message}`, 'error');
            }
        }

        // Teste 4: Verificar assignments recentes
        async function checkRecentAssignments() {
            addLog('⏰ TESTE 4: Verificando assignments das últimas 24h...', 'warning');
            
            try {
                const assignmentsRef = window.collection(window.firebaseDb, 'deliveryAssignments');
                const snapshot = await window.getDocs(assignmentsRef);
                
                const now = new Date();
                const last24h = new Date(now.getTime() - 24 * 60 * 60 * 1000);
                
                let recentAssignments = [];
                let rivanilsonRecent = [];
                
                snapshot.forEach((doc) => {
                    const data = doc.data();
                    const assignedAt = data.assignedAt ? new Date(data.assignedAt) : null;
                    
                    if (assignedAt && assignedAt > last24h) {
                        recentAssignments.push({
                            id: doc.id,
                            deliveryId: data.deliveryId,
                            deliveryName: data.deliveryName,
                            status: data.status,
                            assignedAt: data.assignedAt,
                            orderId: data.order?.displayId || 'N/A'
                        });
                        
                        if (data.deliveryId === RIVANILSON_ID) {
                            rivanilsonRecent.push({
                                orderId: data.order?.displayId || doc.id,
                                status: data.status,
                                assignedAt: data.assignedAt
                            });
                        }
                    }
                });
                
                addLog(`📊 Total de assignments nas últimas 24h: ${recentAssignments.length}`, 'log');
                addLog(`📊 Assignments do Rivanilson nas últimas 24h: ${rivanilsonRecent.length}`, rivanilsonRecent.length > 0 ? 'success' : 'error');
                
                if (rivanilsonRecent.length > 0) {
                    addLog('✅ Assignments recentes do Rivanilson:', 'success');
                    rivanilsonRecent.forEach(assignment => {
                        const timestamp = new Date(assignment.assignedAt).toLocaleString('pt-BR');
                        addLog(`  Pedido #${assignment.orderId} (${assignment.status}) - ${timestamp}`, 'success');
                    });
                } else {
                    addLog('❌ Nenhum assignment recente para Rivanilson', 'error');
                    
                    if (recentAssignments.length > 0) {
                        addLog('📋 Assignments recentes de outros entregadores:', 'warning');
                        recentAssignments.slice(0, 5).forEach(assignment => {
                            const timestamp = new Date(assignment.assignedAt).toLocaleString('pt-BR');
                            addLog(`  Pedido #${assignment.orderId} → ${assignment.deliveryName} (${assignment.status}) - ${timestamp}`, 'log');
                        });
                    }
                }
                
            } catch (error) {
                addLog(`❌ ERRO ao verificar assignments recentes: ${error.message}`, 'error');
            }
        }

        // Funções utilitárias
        function addLog(message, type = 'log') {
            const results = document.getElementById('results');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            logEntry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            
            results.appendChild(logEntry);
            results.scrollTop = results.scrollHeight;
            
            // Também logar no console
            console.log(message);
        }

        function clearLogs() {
            document.getElementById('results').innerHTML = '';
        }

        // Tornar funções globais
        window.runFullDiagnostic = runFullDiagnostic;
        window.checkFirebaseAssignments = checkFirebaseAssignments;
        window.testEmailMapping = testEmailMapping;
        window.clearLogs = clearLogs;
    </script>
</body>
</html>
