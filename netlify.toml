# netlify.toml
# Configuração para o Netlify

[build]
  # Diretório de publicação (onde está o index.html)
  publish = "."
  
  # Comando de build simplificado
  command = "echo 'Build concluído - usando Firebase Web SDK'"

[functions]
  # Diretório das funções Netlify (apenas para ifood-proxy)
  directory = "netlify/functions"
  
  # Configurações das funções
  node_bundler = "esbuild"

[[redirects]]
  # Redirecionamento para SPA (Single Page Application)
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Configurações de cabeçalhos para CORS
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"

# Configurações específicas para arquivos estáticos
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Configurações de ambiente
[context.production.environment]
  NODE_ENV = "production"

[context.branch-deploy.environment]
  NODE_ENV = "development"

# Configurações específicas para Firebase
[[headers]]
  for = "/motoboy.html"
  [headers.values]
    Cache-Control = "no-cache"
    X-Frame-Options = "SAMEORIGIN"
